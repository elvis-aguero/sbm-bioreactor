name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      # Caches the full ~/.julia depot (registries, artifacts, and -- critically --
      # each package's compiled precompile/package-image cache). Gridap's AD-heavy
      # monolithic residual/Jacobian is expensive to JIT-compile from a cold depot
      # (tens of minutes); SBM_Bioreactor's own PrecompileTools.@compile_workload
      # (src/SBM_Bioreactor.jl) bakes that compiled code into its precompile cache
      # during the build step below.
      #
      # Uses actions/cache directly (not julia-actions/cache) so the primary key can
      # include github.sha: SBM_Bioreactor is a local, unregistered package, so its own
      # source changes aren't reflected in Project.toml/Manifest.toml at all -- keying
      # only on those would let a stale, pre-change compiled image satisfy the cache on
      # every commit that only touches src/, meaning Julia recompiles it fresh every
      # time (correctly detecting the mismatch) while this step just restores the same
      # outdated snapshot. The restore-keys prefix (Project.toml/Manifest.toml hash
      # only) still lets slow-to-compile dependencies like Gridap and Plots restore
      # from any prior run even when the exact per-commit key misses.
      - uses: actions/cache@v4
        with:
          path: ~/.julia
          key: julia-${{ runner.os }}-${{ hashFiles('Project.toml', 'Manifest.toml') }}-${{ github.sha }}
          restore-keys: |
            julia-${{ runner.os }}-${{ hashFiles('Project.toml', 'Manifest.toml') }}-

      - uses: julia-actions/julia-buildpkg@v1

      # coverage defaults to true, which passes --code-coverage=@<path> to Julia.
      # Coverage instrumentation requires re-instrumented compilation of any method
      # that actually executes, which cannot reuse a precompiled cache regardless of
      # depot caching or type-matching -- measured locally: a jacobian assembly call
      # that takes ~3s normally (precompiled cache hit) did not finish in 5 minutes
      # under coverage (>100x slower), and this repo does not upload or otherwise
      # consume coverage data anywhere, so disabling it costs nothing.
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: false
